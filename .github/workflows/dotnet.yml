name: Build Mint Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # 1. Micro version
    - name: Build Framework-Dependent (Micro)
      run: >
        dotnet publish Mint.csproj 
        -c Release 
        -r win-x64 
        --self-contained false 
        -p:PublishSingleFile=true 
        -o ./dist-micro

    # 2. Standalone version (runs on any PC without .NET installed)
    - name: Build Standalone
      run: >
        dotnet publish Mint.csproj 
        -c Release 
        -r win-x64 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:IncludeNativeLibrariesForSelfExtract=true 
        -p:EnableCompressionInSingleFile=true 
        -o ./dist-standalone

    - name: Upload Micro
      uses: actions/upload-artifact@v4
      with:
        name: Mint-Micro-x64
        path: ./dist-micro/Mint.exe

    - name: Upload Standalone
      uses: actions/upload-artifact@v4
      with:
        name: Mint-Standalone-x64
        path: ./dist-standalone/Mint.exe
